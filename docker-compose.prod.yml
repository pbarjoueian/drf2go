# Production Docker Compose configuration
# Uses YAML anchors to reduce duplication

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-drf2go}
  POSTGRES_USER: ${POSTGRES_USER:-db_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}

x-django-env: &django-env
  POSTGRES_DB: ${POSTGRES_DB:-drf2go}
  POSTGRES_USER: ${POSTGRES_USER:-db_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
  DATABASE_URL: postgresql://${POSTGRES_USER:-db_user}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-drf2go}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-replace-me-with-secure-password}
  REDIS_DB: ${REDIS_DB:-0}
  # Construct REDIS_URL with password if provided
  REDIS_URL: ${REDIS_URL:-redis://${REDIS_PASSWORD:-replace-me-with-secure-password}@redis:6379/${REDIS_DB:-0}}

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    restart: always
    environment:
      - SERVER_NAME=${SERVER_NAME:-_}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drf2go}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DATABASE_URL: postgresql://${POSTGRES_USER:-db_user}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-drf2go}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-replace-me-with-secure-password}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: ${REDIS_URL:-redis://${REDIS_PASSWORD:-replace-me-with-secure-password}@redis:6379/${REDIS_DB:-0}}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    restart: always
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',8000)); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - db
      - rabbitmq
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *django-env
    volumes:
      - logs_volume:/app/logs
    restart: always
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - db
      - rabbitmq
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *django-env
    volumes:
      - logs_volume:/app/logs
    restart: always
    command: celery -A config beat -l info
    depends_on:
      - db
      - rabbitmq
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      <<: *database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port (consider restricting in production)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      sh -c "redis-server
      --requirepass $${REDIS_PASSWORD}
      --appendonly yes"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-replace-me-with-secure-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "redis-cli -a $${REDIS_PASSWORD} ping"
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  rabbitmq_data:
  redis_data:
