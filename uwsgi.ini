[uwsgi]
chdir = /app
module = config.wsgi:application
master = true
processes = 4
threads = 2
# Use socket for communication with nginx
socket = :8000
vacuum = true
enable-threads = true
harakiri = 30
buffer-size = 32768
die-on-term = true
# uWSGI will communicate with nginx via socket, so static files are handled by nginx
# Remove static-map as nginx will serve static files directly
