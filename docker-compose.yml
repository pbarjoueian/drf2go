# Development Docker Compose configuration
# Uses YAML anchors to reduce duplication

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-drf2go}
  POSTGRES_USER: ${POSTGRES_USER:-db_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}

x-django-env: &django-env
  POSTGRES_DB: ${POSTGRES_DB:-drf2go}
  POSTGRES_USER: ${POSTGRES_USER:-db_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
  DATABASE_URL: postgresql://${POSTGRES_USER:-db_user}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-drf2go}
  DJANGO_SETTINGS_MODULE: config.settings.base

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      <<: *django-env
      # Redis configuration (optional for development)
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    volumes:
      - .:/app:cached
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',8000)); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - db
      - rabbitmq
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      <<: *database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Development: Redis without password by default
    # Set REDIS_PASSWORD in .env if you want password protection
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
        redis-server --requirepass $${REDIS_PASSWORD} --appendonly yes;
      else
        redis-server --appendonly yes;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Don't expose port externally in development (use docker network)
    # Access via: docker-compose exec redis redis-cli
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
          redis-cli -a $${REDIS_PASSWORD} ping;
        else
          redis-cli ping;
        fi"
      interval: 30s
      timeout: 10s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      <<: *django-env
    volumes:
      - .:/app:cached
      - ./logs:/app/logs
    restart: unless-stopped
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - db
      - rabbitmq
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      <<: *django-env
    volumes:
      - .:/app:cached
      - ./logs:/app/logs
    restart: unless-stopped
    command: celery -A config beat -l info
    depends_on:
      - db
      - rabbitmq
      - redis

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
