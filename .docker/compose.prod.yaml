# Production stack.
#
#   make prod-up
#   make prod-logs
#   make prod-down
#
# Raw equivalent:
#   docker compose --project-directory . --env-file .env -f .docker/compose.prod.yaml up -d
#
# Differences from the development stack:
#   * `production` image target - no dev dependencies, runs as an unprivileged user
#   * no source bind-mount; the image is immutable
#   * nginx terminates HTTP and serves static/media from shared volumes
#   * DEBUG is forced off, which makes the settings module *require* real
#     RabbitMQ and Redis passwords (see config/settings/sub_settings/)
#   * backing services are not published on the host

name: drf2go

# --- reusable fragments -----------------------------------------------------

x-django-build: &django-build
  build:
    context: .
    dockerfile: .docker/django/Dockerfile
    target: production
  image: drf2go/django:prod
  env_file:
    - ${ENV_FILE:-.env}
  restart: always

# As in the development stack, connections are passed as discrete parameters and
# assembled (with percent-encoding) by the settings layer. The `:?` guards make
# a missing credential a startup error instead of a silent insecure default.
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_ENV: production
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost},localhost,127.0.0.1,web,nginx

  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  RABBITMQ_URL: ${RABBITMQ_URL:-}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}

  REDIS_URL: ${REDIS_URL:-}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: ${REDIS_DB:-0}

x-service-deps: &service-deps
  db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy

# --- edge -------------------------------------------------------------------

services:
  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    image: drf2go/nginx:prod
    restart: always
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      UPSTREAM_HOST: web
      UPSTREAM_PORT: "8000"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100M}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

# --- application services ---------------------------------------------------

  web:
    <<: *django-build
    environment:
      <<: *django-env
      # Exactly one service owns migrations and static collection.
      AUTO_MIGRATE: "true"
      AUTO_COLLECTSTATIC: "true"
    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - --proxy-headers
      - config.asgi:application
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on: *service-deps

  celery_worker:
    <<: *django-build
    environment:
      <<: *django-env
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    command: celery -A config worker -l info --concurrency ${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    healthcheck:
      # CMD-SHELL, not CMD: $HOSTNAME has to be expanded by a shell, and the
      # node name must be pinned so the check fails when *this* worker is down
      # rather than passing because some other replica answered.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on: *service-deps

  celery_beat:
    <<: *django-build
    environment: *django-env
    # DatabaseScheduler keeps its state in PostgreSQL, so beat itself is stateless.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

# --- backing services -------------------------------------------------------

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # postgres:18+ stores the cluster in a version-specific subdirectory,
      # so the volume mounts one level above the old /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - .docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-drf2go.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
