# Rendered by the nginx image entrypoint (envsubst) from
# /etc/nginx/templates/default.conf.template.
#
# Only ${SERVER_NAME}, ${UPSTREAM_HOST}, ${UPSTREAM_PORT} and
# ${CLIENT_MAX_BODY_SIZE} are substituted; nginx's own $variables are untouched
# because they are not present in the container environment.

upstream django {
    server ${UPSTREAM_HOST}:${UPSTREAM_PORT};
    keepalive 32;
}

# Shared proxy settings for both the HTTP and the WebSocket location blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ${SERVER_NAME};
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml text/css text/plain text/xml;

    # Static files collected by `manage.py collectstatic` into the shared volume.
    location /static/ {
        alias /app/static/;
        access_log off;
        # Cache-Control is set explicitly rather than via `expires`, which would
        # emit a second, conflicting Cache-Control header.
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # User uploaded media.
    location /media/ {
        alias /app/media/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        # Uploaded files are never trusted markup.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
    }

    # WebSockets (Django Channels).
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Everything else goes to Daphne. Security headers for these responses come
    # from Django's SecurityMiddleware so there is a single source of truth.
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
