# Mounted into /etc/rabbitmq/conf.d/10-drf2go.conf by the compose stacks.
#
# RabbitMQ 4 stopped permitting two features by default that the Celery/kombu
# client still relies on. Both are re-enabled here; both log a "permitted per
# the configuration" warning at connect time, which is expected and harmless.

# Celery's control plane (`celery inspect` / `celery control`, used by the
# celery_worker healthcheck) and the rpc:// result backend declare transient,
# non-exclusive reply queues. Without this the broker answers 541 INTERNAL_ERROR
# and `celery inspect ping` - hence the healthcheck - fails outright.
deprecated_features.permit.transient_nonexcl_queues = true

# The Celery worker applies its prefetch limit with basic.qos(global=true), so
# the limit is shared across the channel rather than per-consumer. RabbitMQ 4
# refuses that by default and logs it at [error] level on every worker start.
# Celery only stops using global QoS when it detects quorum queues, which this
# stack does not use.
deprecated_features.permit.global_qos = true

# The management plugin's metrics collection is also deprecated but still
# permitted by default, so it only produces a startup warning. It is left alone
# deliberately: it is what backs the management UI on :15672, and explicitly
# permitting it would swap one warning for another.

# `celery inspect ping` (the celery_worker healthcheck) opens a connection and
# drops it without an AMQP close handshake, which RabbitMQ logs as "client
# unexpectedly closed TCP connection". At a 30s interval that is roughly 11k
# spurious warnings per worker per day, enough to bury real messages. Raising
# only the connection category to `error` silences the lifecycle chatter while
# still logging authentication and access-refused failures, which are errors.
log.connection.level = error
